<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 120" width="230" height="120">
  <!-- centro del chasis físico: (115, 70). Caja atrás (x 25..115), moto al frente. -->
  <!-- rueda trasera lejana -->
  <circle cx="82" cy="100" r="17" fill="#1f1f1f" stroke="#111" stroke-width="2"/>
  <circle cx="82" cy="100" r="9" fill="#555" stroke="#111" stroke-width="2"/>
  <!-- chasis / plataforma -->
  <rect x="20" y="82" width="180" height="8" rx="3" fill="#2b2b2b" stroke="#1a1a1a" stroke-width="2"/>
  <!-- panel trasero de la caja -->
  <rect x="29" y="30" width="82" height="28" fill="#d08a4a" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="29" y1="44" x2="111" y2="44" stroke="#b5733a" stroke-width="2"/>
  <!-- paredes -->
  <rect x="25" y="26" width="9" height="34" rx="2" fill="#8b4513" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="106" y="26" width="9" height="34" rx="2" fill="#8b4513" stroke="#1a1a1a" stroke-width="3"/>
  <!-- base de la caja -->
  <rect x="25" y="57" width="90" height="26" rx="4" fill="#2b6cb0" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="25" y1="66" x2="115" y2="66" stroke="#1d4f85" stroke-width="2"/>
  <line x1="25" y1="75" x2="115" y2="75" stroke="#1d4f85" stroke-width="2"/>
  <!-- letrero -->
  <rect x="40" y="61" width="60" height="18" rx="4" fill="#fff4d6" stroke="#1a1a1a" stroke-width="2"/>
  <text x="70" y="75" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2b6cb0" text-anchor="middle">ELOTES</text>
  <!-- olla sobre la caja -->
  <rect x="92" y="8" width="26" height="22" rx="5" fill="#9aa5b1" stroke="#1a1a1a" stroke-width="3"/>
  <ellipse cx="105" cy="8" rx="14" ry="4" fill="#c7d0da" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="105" cy="4" r="3" fill="#2b2b2b"/>
  <!-- motor -->
  <rect x="126" y="62" width="30" height="22" rx="5" fill="#777" stroke="#1a1a1a" stroke-width="3"/>
  <g stroke="#1a1a1a" stroke-width="2"><line x1="130" y1="68" x2="152" y2="68"/><line x1="130" y1="74" x2="152" y2="74"/><line x1="130" y1="80" x2="152" y2="80"/></g>
  <!-- escape -->
  <path d="M156 78 L178 86 L196 84" stroke="#9aa5b1" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- asiento -->
  <path d="M126 50 L168 50 L164 42 L130 42 Z" fill="#2b2b2b" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
  <rect x="124" y="50" width="48" height="10" rx="3" fill="#2b6cb0" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- tanque y faro -->
  <path d="M170 60 L190 44 L196 48 L198 70 Z" fill="#2b6cb0" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="200" cy="50" r="8" fill="#fff1a8" stroke="#1a1a1a" stroke-width="3"/>
  <!-- manubrio -->
  <path d="M186 44 L182 30" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>
  <path d="M182 30 L168 28" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
  <path d="M168 28 L160 27" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
  <!-- horquilla -->
  <path d="M194 56 L200 96" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>
  <!-- guardafango -->
  <path d="M182 86 Q200 70 218 86" stroke="#2b6cb0" stroke-width="7" stroke-linecap="round" fill="none"/>
</svg>
